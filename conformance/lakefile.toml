name = "hex-gfq-field-conformance"
defaultTargets = ["HexGFqFieldConformance", "hexgfqfield_emit_fixtures"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexGFqField"
path = ".."

[[require]]
name = "HexConway"
git = "https://github.com/leanprover/hex-conway.git"
rev = "f8d2a5b69ce60d973236614d8d0fcee11e8c8467"

[[require]]
name = "hex-test-kit"
git = "https://github.com/leanprover/hex-test-kit.git"
rev = "5b3dc5d7789cb680d64f8f4046254f93b7424e4f"

[[lean_lib]]
name = "HexGFqFieldConformance"
globs = ["HexGFqField.Conformance"]

[[lean_exe]]
name = "hexgfqfield_emit_fixtures"
root = "HexGFqField.EmitFixtures"
